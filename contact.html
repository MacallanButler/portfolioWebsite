<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | Macallan Butler</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav">
    <a href="index.html">About</a>
    <a href="projects.html">Projects</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main class="contact">
  <h2 class="section-title fade-gradient">Contact Me</h2>
  <p class="section-subtitle fade-gradient fade-gradient-delay">Got a project or idea? Let’s chat!</p>

  <form id="contactForm" action="https://formspree.io/f/myzpqozk" method="POST" class="contact-form">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required placeholder="Your Name" />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required placeholder="you@example.com" />

    <label for="message">Message</label>
    <textarea id="message" name="message" rows="6" required placeholder="Write your message here"></textarea>

    <button type="submit" class="btn">Send Message</button>
    <p id="formMessage">Thanks! Your message has been sent.</p>
  </form>
</main>

<footer class="site-footer">
  <p>&copy; 2025 Macallan Butler</p>
</footer>

<script>
const form = document.getElementById('contactForm');
const formMessage = document.getElementById('formMessage');

form.addEventListener('submit', async function(event) {
  event.preventDefault();
  const formData = new FormData(form);
  try {
    const response = await fetch(form.action, {
      method: form.method,
      body: formData,
      headers: { 'Accept': 'application/json' }
    });
    if (response.ok) {
      showMessage('Thanks! Your message has been sent.', 'green');
      form.reset();
    } else {
      showMessage('Ruh Roh! There was a problem sending your message.', 'red');
    }
  } catch (error) {
    showMessage('Ruh Roh! There was a problem sending your message.', 'red');
  }
});

function showMessage(message, color) {
  formMessage.textContent = message;
  formMessage.style.color = color;
  formMessage.classList.add('show');
  setTimeout(() => {
    formMessage.classList.remove('show');
  }, 4000);
}
</script>

<script src="animations.js"></script>
</body>
</html>
